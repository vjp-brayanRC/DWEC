<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="ejercicio4.css">
</head>
<body>
    <h1>Restaurantes Cáceres</h1>

    <!-- Botón que al hacer clic muestra el dropdown -->
    <div class="d-grid gap-2 mb-3">
        <button id="cargarBtn" class="btn btn-primary" type="button" style="background-color:grey;">Cargar Restaurantes</button>
    </div>

    <!-- Contenedor con scroll para la tabla -->
    <div class="scrollable-table">
        <table class="table table-striped mb-0"> <!-- mb-0 evita margen inferior extra -->
            <thead class="table-light">
                <tr>
                    <th>Restaurante</th>
                    <th>Nombres</th>
                    <th>Web</th>
                    <th>Dirección</th>
                    <th>Máximo aforo</th>
                </tr>
            </thead>
            <tbody id="tablaBody">
                <!-- Las filas se pueden añadir aquí más tarde si quieres -->
            </tbody>
        </table>
    </div>

    <!-- Contenedor donde aparecerá el dropdown (inicialmente vacío) -->
    <div id="dropdownContainer"></div>


    <script src="ejercicio4.html"></script>
</body>
</html>
