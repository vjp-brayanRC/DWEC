<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Post</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f4;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .titulo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: white;
            background-color: black;
        }

        .contenido {
            background-color: #fff59d;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .botones {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .botones button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: #1976d2;
            color: white;
            cursor: pointer;
        }

        .comentarios {
            height: 200px;
            border: 2px dashed #ccc;
            border-radius: 5px;
            background-color: #fafafa;
            padding: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="titulo">TITULO: titulo</div>
        <div class="contenido">Contenido: contenido</div>
        <div class="botones">
            <button>Usuario del Post</button>
            <button>Mostrar comentarios</button>
        </div>
        <div class="comentarios">
            <!-- Aquí irían los comentarios -->
        </div>
    </div>
    <script src="tarea_3.js"></script>
</body>

</html>
