<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Geolocalización</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link rel="stylesheet" href="ejercicio1.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Mi Ubicación en Tiempo Real</h1>
            <p class="subtitle">Actualización cada 30 segundos</p>
        </header>

        <div id="map"></div>

        <div class="info-panel">
            <div class="info-item">
                <span class="label">Latitud:</span>
                <span id="latitude" class="value">--</span>
            </div>
            <div class="info-item">
                <span class="label">Longitud:</span>
                <span id="longitude" class="value">--</span>
            </div>
            <div class="info-item">
                <span class="label">Precisión:</span>
                <span id="accuracy" class="value">--</span>
            </div>
            <div class="info-item">
                <span class="label">Última actualización:</span>
                <span id="timestamp" class="value">--</span>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.min.js"></script>
    <script src="ejercicio1.js"></script>
</body>

</html>
