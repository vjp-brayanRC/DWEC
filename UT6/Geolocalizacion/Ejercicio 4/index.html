<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Acceso y edad</title>
  </head>
  <body>
    <h1>Acceso y edad</h1>
    <label for="nombre">Introduce tu nombre:</label>
    <input type="text" id="nombre" />

    <div id="resultado"></div>
    <div id="formEdad" style="display:none;">
      <label for="edad">Introduce tu edad:</label>
      <input type="number" id="edad" />

    </div>
    <hr />
    <button id="listar">Listar personas</button>
    <ul id="lista"></ul>
  </body>
</html>
